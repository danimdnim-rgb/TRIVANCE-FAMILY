*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:radial-gradient(ellipse at 50% -5%,rgba(212,175,90,.12),transparent 55%),var(--bg);color:var(--ink);font:400 16px/1.7 'Cairo','Segoe UI',Tahoma,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
[hidden]{display:none!important}
.logo{aspect-ratio:1;background:var(--logo) center/contain no-repeat;-webkit-mask-image:radial-gradient(closest-side,#000 90%,transparent 100%);mask-image:radial-gradient(closest-side,#000 90%,transparent 100%)}

/* الشاشة الافتتاحية */
#splash{position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:var(--bg);cursor:pointer;animation:out .9s 2.6s forwards}
#splash .logo{width:min(84vw,440px);animation:pop 1.8s cubic-bezier(.2,.7,.2,1) both}
#splash.done{display:none}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;visibility:hidden}}

.bar{display:flex;justify-content:flex-end;padding:14px 18px 0}
.lang{background:none;border:1px solid var(--line);color:var(--gold);border-radius:999px;padding:3px 16px;font:inherit;font-size:.85rem;cursor:pointer}
.lang:hover{background:rgba(212,175,90,.1)}
.hero{text-align:center;padding:0 20px}
.hero .logo{width:min(72vw,330px);margin:0 auto}
h1{margin-top:-8px;font:700 clamp(1.5rem,6.4vw,2.3rem)/1.2 'Cinzel',Georgia,serif;letter-spacing:.14em;background:linear-gradient(180deg,var(--hi),var(--gold) 55%,var(--lo));-webkit-background-clip:text;background-clip:text;color:transparent}

.card{position:relative;max-width:560px;margin:62px 16px 40px;padding:0 22px 26px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(180deg,rgba(212,175,90,.08),rgba(255,255,255,.02));box-shadow:0 24px 70px rgba(0,0,0,.55);animation:rise 1s .2s both}
@media(min-width:600px){.card{margin-inline:auto}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.emb{width:92px;height:92px;margin:-46px auto 8px;border-radius:50%;border:1px solid var(--gold);background:var(--bg) var(--logo) 50% 13%/183% no-repeat;box-shadow:0 0 0 7px var(--bg),0 0 34px rgba(212,175,90,.3)}
h2{text-align:center;font-size:1.45rem;color:var(--hi)}
.intro{text-align:center;color:#b3aa94;font-size:.93rem;margin-bottom:20px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld{display:grid;gap:4px;margin-bottom:14px;font-size:.92rem;color:var(--hi);align-content:start}
.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--err)}
.fld.bad::after{content:attr(data-err);color:var(--err);font-size:.8rem}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:0;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus,textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,90,.2)}
select option{background:#15120b}
textarea{resize:vertical;min-height:96px}
fieldset{border:0;padding:0;margin-bottom:16px}
legend{font-size:.92rem;color:var(--hi);margin-bottom:6px}
.pls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.chip{position:relative;display:block}
.chip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer}
.chip span{display:grid;justify-items:center;gap:2px;padding:12px 4px;border:1px solid var(--line);border-radius:14px;color:#b3aa94;transition:.2s}
.chip input:checked+span{border-color:var(--gold);color:var(--hi);background:rgba(212,175,90,.13);box-shadow:0 0 20px rgba(212,175,90,.22)}
.chip input:focus-visible+span{outline:2px solid var(--hi);outline-offset:2px}
.go{display:block;width:100%;margin-top:4px;border:0;border-radius:14px;padding:14px;text-align:center;text-decoration:none;font:700 1.05rem 'Cairo',sans-serif;color:#1a1305;background:linear-gradient(135deg,var(--hi),var(--gold) 50%,var(--lo));box-shadow:0 10px 30px rgba(212,175,90,.28);cursor:pointer;transition:transform .15s}
.go:active{transform:scale(.98)}
.note{margin-top:12px;text-align:center;color:#a39a85;font-size:.82rem}
.ok{text-align:center;padding:12px 0 4px}
.ok svg{width:56px;height:56px;color:var(--gold);margin-bottom:6px}
.ok p{color:#c9c0aa;margin:8px 0 20px}
.alt{display:block;margin-top:10px;padding:12px;border:1px solid var(--gold);border-radius:14px;color:var(--hi);text-decoration:none;font-weight:600}
.alt:hover{background:rgba(212,175,90,.1)}
.again{margin-top:14px;background:none;border:0;color:var(--gold);font:inherit;text-decoration:underline;cursor:pointer}
footer{text-align:center;color:#7d765f;font-size:.8rem;padding:0 0 28px}
@media(prefers-reduced-motion:reduce){#splash{display:none}.card{animation:none}}
</style>
</head>
<body>
<div id="splash" role="img" aria-label="TRIVANCE"><div class="logo"></div></div>

<div class="bar"><button class="lang" id="lang" type="button" data-t="lg"></button></div>

<header class="hero">
  <div class="logo" role="img" aria-label="TRIVANCE — Scientific, Cultural &amp; Sports Club"></div>
  <h1>TRIVANCE FAMILY</h1>
</header>

<main class="card">
  <div class="emb" role="img" aria-label="TRIVANCE"></div>

  <form id="f" novalidate>
    <h2 data-t="title"></h2>
    <p class="intro" data-t="intro"></p>

    <div class="row">
      <label class="fld"><span data-t="fn"></span><input name="fn" autocomplete="given-name"></label>
      <label class="fld"><span data-t="ln"></span><input name="ln" autocomplete="family-name"></label>
    </div>
    <label class="fld"><span data-t="ph"></span><input name="ph" type="tel" inputmode="tel" autocomplete="tel" dir="ltr" placeholder="+000 000 000 000"></label>

    <label class="fld"><span data-t="yr"></span>
      <select name="yr">
        <option value="" data-t="y0"></option>

        <option value="ماستر / دراسات عليا" data-t="y5"></option>
        <option value="أخرى" data-t="y6"></option>
      </select>
    </label>

    <fieldset>
      <legend data-t="pl"></legend>
      <div class="pls">
        <label class="chip"><input type="checkbox" name="pl" value="علمي"><span>
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5zM12 6.5v13"/></svg>
          <b data-t="p1"></b></span></label>
        <label class="chip"><input type="checkbox" name="pl" value="ثقافي"><span>
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14M6.5 7h11M9 7v10M15 7v10M6.5 17h11M5 20h14"/></svg>
          <b data-t="p2"></b></span></label>
        <label class="chip"><input type="checkbox" name="pl" value="رياضي"><span>
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="14.5" cy="4.5" r="1.6"/><path d="M12.5 9.5l2.5 1.5 2.5-1M12.5 9.5l-2 4.5 3 2.5-1.5 4M10.5 14l-3.5 1"/></svg>
          <b data-t="p3"></b></span></label>
      </div>
    </fieldset>

    <label class="fld"><span data-t="rs"></span><textarea name="rs" rows="4"></textarea></label>
    <button class="go" type="submit" data-t="send"></button>
    <p class="note" data-t="note"></p>
  </form>

  <section class="ok" id="ok" hidden aria-live="polite">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>
    <h2 data-t="okT"></h2>
    <p data-t="okP"></p>
    <a class="go" id="wa" href="#" target="_blank" rel="noopener" data-t="okB"></a>
    <a class="alt" id="wa2" href="#" target="_blank" rel="noopener" data-t="okB2"></a>
    <button class="again" id="again" type="button" data-t="again"></button>
  </section>
</main>

<footer>© TRIVANCE FAMILY</footer>

/* أرقام واتساب المسؤولين بالصيغة الدولية بدون + (الأول يُفتح تلقائيًا، والثاني زر احتياطي) */
const ADMINS = ["213791683095", "213669267921"];

const L = {
  ar: {lg:'English', title:'استمارة الانخراط', intro:'املأ بياناتك لتنضم إلى عائلة النادي',
    fn:'الاسم', ln:'اللقب', ph:'رقم الهاتف', st:'التخصص الجامعي', yr:'السنة الدراسية (اختياري)',
    y0:'اختر…', y1:'سنة أولى', y2:'سنة ثانية', y3:'سنة ثالثة', y4:'سنة رابعة', y5:'ماستر / دراسات عليا', y6:'أخرى',
    pl:'اختر ركنك (يمكنك اختيار أكثر من ركن)', p1:'علمي', p2:'ثقافي', p3:'رياضي',
    rs:'سبب الانخراط في النادي', send:'إرسال الاستمارة إلى المسؤول',
    note:'سيفتح واتساب برسالة جاهزة. اضغط «إرسال» هناك لإتمام تسجيلك.',
    er:'هذا الحقل مطلوب', ep:'أدخل رقم هاتف صحيحًا',
    okT:'أهلًا بك في عائلة TRIVANCE', okP:'استمارتك جاهزة. إن لم يفتح واتساب تلقائيًا فاضغط الزر أدناه، ثم اضغط «إرسال» داخل المحادثة.',
    okB:'فتح واتساب', okB2:'أو أرسلها إلى المسؤول الثاني', again:'تعبئة استمارة جديدة'},
  en: {lg:'العربية', title:'Membership form', intro:'Fill in your details to join the club family',
    fn:'First name', ln:'Last name', ph:'Phone number', st:'Field of study', yr:'Year of study (optional)',
    y0:'Select…', y1:'1st year', y2:'2nd year', y3:'3rd year', y4:'4th year', y5:'Master’s / Postgraduate', y6:'Other',
    pl:'Choose your pillar (you can pick more than one)', p1:'Scientific', p2:'Cultural', p3:'Sports',
    rs:'Why do you want to join?', send:'Send the form to the admin',
    note:'WhatsApp will open with a ready message. Tap “Send” there to complete your registration.',
    er:'This field is required', ep:'Enter a valid phone number',
    okT:'Welcome to the TRIVANCE family', okP:'Your form is ready. If WhatsApp didn’t open automatically, tap the button below, then press “Send” in the chat.',
    okB:'Open WhatsApp', okB2:'Or send it to the second admin', again:'Fill in a new form'}
};
let lang = 'ar';
const $ = s => document.querySelector(s), f = $('#f');

function clearErr(){ f.querySelectorAll('.bad').forEach(e => e.classList.remove('bad')); }
function setLang(l){
  lang = l; const d = L[l], h = document.documentElement;
  h.lang = l; h.dir = l === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(e => e.textContent = d[e.dataset.t]);
  clearErr();
}
setLang('ar');
$('#lang').onclick = () => setLang(lang === 'ar' ? 'en' : 'ar');
$('#splash').onclick = () => $('#splash').classList.add('done');

f.addEventListener('submit', e => {
  e.preventDefault(); clearErr();
  const fd = new FormData(f), v = Object.fromEntries(fd), pl = fd.getAll('pl');
  let ok = true;
  const bad = (n, m) => { const el = f.elements[n].closest('.fld'); el.classList.add('bad'); el.dataset.err = m; ok = false; };
  ['fn','ln','st','rs'].forEach(n => { if (!v[n].trim()) bad(n, L[lang].er); });
  const ph = v.ph.trim(), digits = ph.replace(/\D/g, '');
  if (!/^\+?[\d\s\-().]+$/.test(ph) || digits.length < 8 || digits.length > 15) bad('ph', L[lang].ep);
  if (!ok) { f.querySelector('.bad input, .bad textarea').focus(); return; }

  const msg = [
    '*استمارة انخراط جديدة — TRIVANCE FAMILY*', '',
    'الاسم: ' + v.fn.trim(), 'اللقب: ' + v.ln.trim(), 'الهاتف: ' + ph,
    'التخصص: ' + v.st.trim(), 'السنة الدراسية: ' + (v.yr || '—'),
    'الأركان: ' + (pl.join('، ') || '—'), 'سبب الانخراط: ' + v.rs.trim()
  ].join('\n');
  const link = n => 'https://wa.me/' + n + '?text=' + encodeURIComponent(msg);

  $('#wa').href = link(ADMINS[0]);
  $('#wa2').href = link(ADMINS[1]);
  f.hidden = true; $('#ok').hidden = false;
  $('.card').scrollIntoView({behavior:'smooth', block:'start'});
  window.open(link(ADMINS[0]), '_blank', 'noopener');
});
$('#again').onclick = () => { f.reset(); $('#ok').hidden = true; f.hidden = false; };
</script>
</body>
</html>
